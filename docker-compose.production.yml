name: aperture

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: aperture
    volumes:
      - aperture-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://aperture:${POSTGRES_PASSWORD}@db:5432/aperture
      MIGRATIONS_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aperture:${POSTGRES_PASSWORD}@db:5432/aperture
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      APP_ENV: production
      PORT: 8000
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aperture:${POSTGRES_PASSWORD}@db:5432/aperture
      WORKER_INTERVAL_SECONDS: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: ./services/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      APERTURE_SURFACE: app
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aperture-app.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in Dokploy}`)"
      - "traefik.http.routers.aperture-app.entrypoints=websecure"
      - "traefik.http.routers.aperture-app.tls.certResolver=letsencrypt"
      - "traefik.http.services.aperture-app.loadbalancer.server.port=3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  aperture-data:

networks:
  dokploy-network:
    external: true
