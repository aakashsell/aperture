name: plausible

services:
  plausible:
    image: plausible/analytics:v2.1.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible-db
      - plausible-events-db
    environment:
      BASE_URL: https://analytics.bazement.net
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE:?Set PLAUSIBLE_SECRET_KEY_BASE in Dokploy}
      DATABASE_URL: postgres://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible-db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://plausible-events-db:8123/plausible_events_db
      DISABLE_REGISTRATION: "true"
      MAILER_ADAPTER: Bamboo.MuaAdapter
      ENABLE_EMAIL_VERIFICATION: "false"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plausible.rule=Host(`analytics.bazement.net`)"
      - "traefik.http.routers.plausible.entrypoints=websecure"
      - "traefik.http.routers.plausible.tls.certResolver=letsencrypt"
      - "traefik.http.services.plausible.loadbalancer.server.port=8000"

  plausible-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD:?Set PLAUSIBLE_DB_PASSWORD in Dokploy}
      POSTGRES_USER: plausible
      POSTGRES_DB: plausible
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
      interval: 5s
      timeout: 5s
      retries: 12

  plausible-events-db:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    volumes:
      - plausible-events-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  plausible-db-data:
  plausible-events-data:

networks:
  dokploy-network:
    external: true
