version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: ${APERTURE_DEV_DB_PASSWORD:?Run make dev to generate local-only credentials}
      POSTGRES_DB: aperture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture"]
      interval: 2s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://aperture:${APERTURE_DEV_DB_PASSWORD}@db:5432/aperture
    volumes:
      - ../db/migrations:/migrations
      - ../db/seeds:/seeds
      - ../scripts:/scripts
    working_dir: /scripts
    entrypoint: ["sh", "/scripts/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../services/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aperture:${APERTURE_DEV_DB_PASSWORD}@db:5432/aperture
      PORT: 8000
      JWT_SECRET: ${APERTURE_DEV_JWT_SECRET:?Run make dev to generate local-only credentials}
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ../worker
    environment:
      DATABASE_URL: postgresql://aperture:${APERTURE_DEV_DB_PASSWORD}@db:5432/aperture
      WORKER_INTERVAL_SECONDS: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../services/web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
