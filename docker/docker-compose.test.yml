version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture"]
      interval: 2s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
    volumes:
      - ../db/migrations:/migrations
      - ../db/seeds:/seeds
      - ../scripts:/scripts
    working_dir: /scripts
    entrypoint: ["sh", "/scripts/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-32-characters}
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    image: python:3.12-slim
    volumes:
      - ../tests/integration:/tests
      - ../worker:/worker
    working_dir: /tests
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
    command: >
      sh -c "
        pip install requests psycopg2-binary numpy scipy -q &&
        python test_e2e.py
      "
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata_test:
