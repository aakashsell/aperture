name: Verify Aperture
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: aperture-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: aperture
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U aperture' --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://aperture:aperture-ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/aperture
      JWT_SECRET: aperture-ci-jwt-${{ github.run_id }}-${{ github.run_attempt }}-test-only-signing-key
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt requests
      - run: npm ci
        working-directory: services/web
      - run: go test ./... && go vet ./... && go build -o /tmp/aperture-api .
        working-directory: services/api
      - run: python -m unittest discover -s worker -p 'test_*.py'
      - run: services/web/node_modules/.bin/tsc -p sdks/ts/tsconfig.json && node --test sdks/ts/tests/sdk.test.cjs
      - run: MIGRATIONS_DIR="$PWD/db/migrations" sh scripts/migrate.sh
      - run: |
          /tmp/aperture-api > /tmp/aperture-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$API_URL/health" && break || sleep 1; done
          python tests/integration/test_e2e.py
          node sdks/ts/tests/live.cjs
      - run: npm run build
        working-directory: services/web
      - run: npx playwright install --with-deps chromium
        working-directory: services/web
      - run: npm run test:e2e
        working-directory: services/web
